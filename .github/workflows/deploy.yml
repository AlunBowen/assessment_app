name: Deploy Laravel Docker App

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SSH_PRIVATE_KEY
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync code (excluding sensitive files)
        run: |
          rsync -avz --exclude '.git' \
                     --exclude 'node_modules' \
                     --exclude '.env' \
                     ./ ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/var/www/assessment_app/

      - name: SSH into droplet and deploy
        run: |
          ssh ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} << 'EOF'
          cd /var/www/assessment_app
          docker compose down
          docker compose build --no-cache
          docker compose up -d
          docker compose exec app php artisan migrate --force
          EOF
